name: Auto Merge PRs and Sync Branches

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - 'feature/**'
      - 'dev/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # 1. Automatically merge open Pull Requests
  merge-prs:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Enable Auto-Merge
        run: gh pr merge "$PR_URL" --auto --squash --repo "$GITHUB_REPOSITORY"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Automatically merge source branches directly into target branch
  merge-branches:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Branch into Main
        run: |
          git checkout main
          git merge --no-ff "${{ github.ref_name }}" -m "Auto-merge ${{ github.ref_name }} into main"
          git push origin main
